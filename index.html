<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>💸 Gastos</title>
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #8e8e93;
    --accent: #007aff;
    --danger: #ff3b30;
    --border: #e5e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f2f2f7;
      --muted: #98989d;
      --border: #2c2c2e;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: calc(70px + env(safe-area-inset-bottom));
    padding-top: env(safe-area-inset-top);
  }
  input, button, select { font-family: inherit; }
  h1, h2, h3 { margin: 0; }

  #app { max-width: 480px; margin: 0 auto; padding: 16px; }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }

  .row { display: flex; justify-content: space-between; align-items: center; }

  .muted { color: var(--muted); font-size: 13px; }

  input[type=text], input[type=password], input[type=number] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
  }

  select {
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
  }

  button {
    border: none;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: white; width: 100%; }
  .btn-danger { background: var(--danger); color: white; }
  .btn-secondary { background: var(--border); color: var(--text); }
  .btn-link { background: none; color: var(--accent); padding: 8px; }

  #login-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
    text-align: center;
  }
  #login-screen .emoji { font-size: 56px; margin-bottom: 8px; }
  #login-screen form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
  #login-error { color: var(--danger); font-size: 14px; min-height: 18px; }

  nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    background: var(--card);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1;
    background: none;
    color: var(--muted);
    border-radius: 0;
    font-size: 12px;
    padding: 10px 0 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-weight: 500;
  }
  nav button.active { color: var(--accent); }
  nav button .icon { font-size: 20px; }

  .tab { display: none; }
  .tab.active { display: block; }

  .expense-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .expense-row:last-child { border-bottom: none; }
  .expense-emoji {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .expense-info { flex: 1; min-width: 0; }
  .expense-desc { font-weight: 500; }
  .expense-amount { font-weight: 600; white-space: nowrap; }

  .cat-bar-bg { background: var(--border); border-radius: 6px; height: 8px; overflow: hidden; margin-top: 6px; }
  .cat-bar-fill { height: 100%; border-radius: 6px; }

  .banner {
    background: #fff3cd;
    color: #664d03;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 14px;
  }
  @media (prefers-color-scheme: dark) {
    .banner { background: #4a3b00; color: #ffe69c; }
  }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .modal { background: var(--card); border-radius: 16px; padding: 20px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }

  .hidden { display: none !important; }
  #toast {
    position: fixed;
    bottom: calc(84px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    z-index: 100;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="login-screen" class="hidden">
  <div class="emoji">💸</div>
  <h1 id="login-title">Gastos</h1>
  <p class="muted" id="login-subtitle">Ingresá tu contraseña.</p>
  <form id="login-form">
    <input type="password" id="login-password" placeholder="Contraseña" autocomplete="current-password" required>
    <div id="login-error"></div>
    <button type="submit" class="btn-primary" id="login-submit">Entrar →</button>
  </form>
</div>

<div id="app" class="hidden">

  <div id="reminder-banner" class="banner hidden"></div>

  <section id="tab-home" class="tab active">
    <div class="card">
      <form id="add-form">
        <input type="text" id="add-input" placeholder="ej: nafta 15000" autocomplete="off" required>
      </form>
    </div>
    <div class="card">
      <h3>Últimos gastos</h3>
      <div id="recent-list"></div>
    </div>
  </section>

  <section id="tab-summary" class="tab">
    <div class="card">
      <div class="row">
        <button class="btn-link" id="month-prev">← Mes ant.</button>
        <h3 id="summary-month-label"></h3>
        <button class="btn-link" id="month-next">Mes sig. →</button>
      </div>
    </div>
    <div class="card">
      <div class="row"><span class="muted">Total del mes</span><strong id="summary-total"></strong></div>
      <div class="row"><span class="muted" id="summary-prev-label"></span><span id="summary-prev-total"></span></div>
    </div>
    <div class="card">
      <h3>Por categoría</h3>
      <div id="summary-categories"></div>
    </div>
    <div class="card">
      <h3>Gastos del mes</h3>
      <div id="month-list"></div>
    </div>
  </section>

  <section id="tab-settings" class="tab">
    <div class="card">
      <h3>Presupuestos mensuales</h3>
      <div id="budgets-list"></div>
    </div>
    <div class="card">
      <div class="row"><h3>Recurrentes</h3><button class="btn-link" id="add-recurring-btn">+ Agregar</button></div>
      <div id="recurring-list"></div>
    </div>
    <div class="card">
      <h3>Cambiar contraseña</h3>
      <form id="password-form" style="display:flex; flex-direction:column; gap:10px;">
        <input type="password" id="pw-current" placeholder="Contraseña actual" required>
        <input type="password" id="pw-new" placeholder="Contraseña nueva" required>
        <button type="submit" class="btn-secondary">Guardar</button>
      </form>
    </div>
    <button class="btn-danger" id="logout-btn" style="width:100%">Cerrar sesión</button>
  </section>

</div>

<nav id="nav" class="hidden">
  <button data-tab="home" class="active"><span class="icon">🏠</span>Inicio</button>
  <button data-tab="summary"><span class="icon">📊</span>Resumen</button>
  <button data-tab="settings"><span class="icon">⚙️</span>Ajustes</button>
</nav>

<div id="toast"></div>

<div id="modal-root"></div>

<script>
'use strict';

const API_BASE = 'https://gastos-api.nicolelipovestky.workers.dev';

const CATEGORIES = {
  comida: { emoji: '🍔', color: '#FF9500' },
  transporte: { emoji: '🚗', color: '#007AFF' },
  salud: { emoji: '💊', color: '#FF3B30' },
  entretenimiento: { emoji: '🎉', color: '#AF52DE' },
  ropa: { emoji: '👗', color: '#FF2D55' },
  hogar: { emoji: '🏠', color: '#34C759' },
  otro: { emoji: '📦', color: '#8E8E93' },
};

let summaryMonth = new Date().toISOString().slice(0, 7);

const TOKEN_KEY = 'gastos_token';
function getToken() { try { return localStorage.getItem(TOKEN_KEY); } catch { return null; } }
function setToken(t) { try { localStorage.setItem(TOKEN_KEY, t); } catch {} }
function clearToken() { try { localStorage.removeItem(TOKEN_KEY); } catch {} }

function fmt(n) {
  return '$' + Math.round(n).toLocaleString('es-AR');
}

function monthLabel(month) {
  const names = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const [y, m] = month.split('-');
  return `${names[parseInt(m, 10) - 1]} ${y}`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

async function api(path, opts = {}) {
  const token = getToken();
  let res;
  try {
    res = await fetch(API_BASE + path, {
      headers: {
        'Content-Type': 'application/json',
        ...(token ? { Authorization: `Bearer ${token}` } : {}),
      },
      ...opts,
    });
  } catch {
    throw new Error('sin conexión, probá de nuevo');
  }
  if (res.status === 401) {
    clearToken();
    showLogin(false);
    throw new Error('no autenticado');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'error de red');
  return data;
}

// ---------- login ----------

function showLogin(needsSetup) {
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('nav').classList.add('hidden');
  document.getElementById('login-title').textContent = needsSetup ? 'Elegí una contraseña' : 'Gastos';
  document.getElementById('login-subtitle').textContent = needsSetup
    ? 'Vas a usarla para proteger tus gastos.'
    : 'Ingresá tu contraseña.';
  document.getElementById('login-submit').textContent = needsSetup ? 'Crear contraseña →' : 'Entrar →';
}

function showApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('nav').classList.remove('hidden');
  loadReminder();
  loadRecent();
}

async function checkSession() {
  if (!getToken()) { showLogin((await fetch(API_BASE + '/api/session').then(r => r.json())).needs_setup); return; }
  try {
    const status = await api('/api/session');
    if (status.authenticated) showApp();
    else showLogin(status.needs_setup);
  } catch {
    showLogin(false);
  }
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  try {
    const res = await fetch(API_BASE + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'error'; return; }
    setToken(data.token);
    document.getElementById('login-password').value = '';
    showApp();
  } catch {
    errEl.textContent = 'no se pudo conectar con el servidor';
  }
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  try { await api('/api/logout', { method: 'POST' }); } catch {}
  clearToken();
  showLogin(false);
});

document.getElementById('password-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const current = document.getElementById('pw-current').value;
  const next = document.getElementById('pw-new').value;
  try {
    await api('/api/password', { method: 'POST', body: JSON.stringify({ current, new: next }) });
    document.getElementById('pw-current').value = '';
    document.getElementById('pw-new').value = '';
    showToast('Contraseña actualizada');
  } catch (err) {
    showToast(err.message);
  }
});

// ---------- nav ----------

document.getElementById('nav').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-tab]');
  if (!btn) return;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b === btn));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === `tab-${btn.dataset.tab}`));
  if (btn.dataset.tab === 'summary') loadSummary();
  if (btn.dataset.tab === 'settings') { loadBudgets(); loadRecurring(); }
});

// ---------- home ----------

function expenseRowHTML(e, { editable } = {}) {
  const cat = CATEGORIES[e.category] || CATEGORIES.otro;
  const date = new Date(e.date).toLocaleDateString('es-AR', { day: '2-digit', month: 'short' });
  return `
    <div class="expense-row" data-id="${e.id}">
      <div class="expense-emoji" style="background:${cat.color}22">${cat.emoji}</div>
      <div class="expense-info">
        <div class="expense-desc">${escapeHTML(e.description)}</div>
        <div class="muted">${date}</div>
      </div>
      <div class="expense-amount">${fmt(e.amount)}</div>
      ${editable ? `<button class="btn-link edit-btn" data-id="${e.id}">✏️</button>` : ''}
    </div>`;
}

function escapeHTML(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

async function loadRecent() {
  const list = await api('/api/expenses/recent');
  const el = document.getElementById('recent-list');
  el.innerHTML = list.length
    ? list.map(e => expenseRowHTML(e)).join('')
    : '<p class="muted">No hay gastos todavía.</p>';
}

document.getElementById('add-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('add-input');
  const note = input.value.trim();
  if (!note) return;
  input.value = '';
  input.disabled = true;
  try {
    const entry = await api('/api/expenses', { method: 'POST', body: JSON.stringify({ note }) });
    showToast(`${CATEGORIES[entry.category]?.emoji || ''} ${entry.description} — ${fmt(entry.amount)}`);
    loadRecent();
  } catch (err) {
    showToast(err.message);
    input.value = note;
  } finally {
    input.disabled = false;
    input.focus();
  }
});

async function loadReminder() {
  try {
    const { pending } = await api('/api/reminder');
    const el = document.getElementById('reminder-banner');
    if (pending && pending.length) {
      const names = pending.map(r => r.description).join(', ');
      el.textContent = `📌 Este mes todavía falta: ${names}.`;
      el.classList.remove('hidden');
    } else {
      el.classList.add('hidden');
    }
  } catch {}
}

// ---------- summary ----------

document.getElementById('month-prev').addEventListener('click', () => shiftMonth(-1));
document.getElementById('month-next').addEventListener('click', () => shiftMonth(1));

function shiftMonth(delta) {
  const [y, m] = summaryMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  summaryMonth = d.toISOString().slice(0, 7);
  loadSummary();
}

async function loadSummary() {
  document.getElementById('summary-month-label').textContent = monthLabel(summaryMonth);
  const [data, monthExpenses] = await Promise.all([
    api(`/api/summary/${summaryMonth}`),
    api(`/api/expenses/${summaryMonth}`),
  ]);

  document.getElementById('summary-total').textContent = fmt(data.total);
  document.getElementById('summary-prev-label').textContent = `vs. ${monthLabel(data.prev_month)}`;
  const diff = data.total - data.prev_total;
  const diffLabel = data.prev_total ? `${diff >= 0 ? '+' : ''}${fmt(diff)}` : '—';
  document.getElementById('summary-prev-total').textContent = `${fmt(data.prev_total)} (${diffLabel})`;

  const catsEl = document.getElementById('summary-categories');
  const entries = Object.entries(data.by_category).sort((a, b) => b[1] - a[1]);
  catsEl.innerHTML = entries.length ? entries.map(([cat, amount]) => {
    const c = CATEGORIES[cat] || CATEGORIES.otro;
    const budget = data.budgets[cat];
    const pct = budget ? Math.min(100, Math.round((amount / budget.limit) * 100)) : null;
    return `
      <div style="margin-bottom:12px">
        <div class="row"><span>${c.emoji} ${cat}</span><span>${fmt(amount)}${budget ? ` / ${fmt(budget.limit)}` : ''}</span></div>
        ${pct !== null ? `<div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${pct}%;background:${pct >= 100 ? 'var(--danger)' : c.color}"></div></div>` : ''}
      </div>`;
  }).join('') : '<p class="muted">Sin gastos este mes.</p>';

  const listEl = document.getElementById('month-list');
  listEl.innerHTML = monthExpenses.length
    ? monthExpenses.map(e => expenseRowHTML(e, { editable: true })).join('')
    : '<p class="muted">Sin gastos este mes.</p>';
  listEl.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => openEditModal(monthExpenses.find(e => e.id === btn.dataset.id)));
  });
}

function openEditModal(expense) {
  const root = document.getElementById('modal-root');
  const catOptions = Object.keys(CATEGORIES)
    .map(c => `<option value="${c}" ${c === expense.category ? 'selected' : ''}>${CATEGORIES[c].emoji} ${c}</option>`)
    .join('');
  root.innerHTML = `
    <div class="modal-overlay" id="edit-overlay">
      <div class="modal">
        <h3>Editar gasto</h3>
        <input type="text" id="edit-desc" value="${escapeHTML(expense.description)}">
        <input type="number" id="edit-amount" value="${expense.amount}">
        <select id="edit-cat">${catOptions}</select>
        <button class="btn-primary" id="edit-save">Guardar</button>
        <button class="btn-danger" id="edit-delete">Eliminar</button>
        <button class="btn-secondary" id="edit-cancel">Cancelar</button>
      </div>
    </div>`;
  const close = () => { root.innerHTML = ''; };
  document.getElementById('edit-overlay').addEventListener('click', (e) => { if (e.target.id === 'edit-overlay') close(); });
  document.getElementById('edit-cancel').addEventListener('click', close);
  document.getElementById('edit-save').addEventListener('click', async () => {
    try {
      await api(`/api/expense/${expense.id}`, {
        method: 'PUT',
        body: JSON.stringify({
          description: document.getElementById('edit-desc').value,
          amount: Number(document.getElementById('edit-amount').value),
          category: document.getElementById('edit-cat').value,
        }),
      });
      close();
      loadSummary();
      loadRecent();
    } catch (err) { showToast(err.message); }
  });
  document.getElementById('edit-delete').addEventListener('click', async () => {
    try {
      await api(`/api/expense/${expense.id}`, { method: 'DELETE' });
      close();
      loadSummary();
      loadRecent();
    } catch (err) { showToast(err.message); }
  });
}

// ---------- settings: budgets ----------

async function loadBudgets() {
  const budgets = await api('/api/budgets');
  const el = document.getElementById('budgets-list');
  el.innerHTML = Object.keys(CATEGORIES).map(cat => `
    <div class="row" style="margin-bottom:10px">
      <span>${CATEGORIES[cat].emoji} ${cat}</span>
      <input type="number" class="budget-input" data-cat="${cat}" value="${budgets[cat] || ''}" placeholder="sin límite" style="width:120px">
    </div>`).join('');
  el.querySelectorAll('.budget-input').forEach(inp => {
    inp.addEventListener('change', async () => {
      const value = Number(inp.value) || 0;
      try {
        await api('/api/budgets', { method: 'POST', body: JSON.stringify({ [inp.dataset.cat]: value }) });
        showToast('Presupuesto guardado');
      } catch (err) { showToast(err.message); }
    });
  });
}

// ---------- settings: recurring ----------

async function loadRecurring() {
  const list = await api('/api/recurring');
  const el = document.getElementById('recurring-list');
  el.innerHTML = list.length ? list.map(r => `
    <div class="expense-row" data-id="${r.id}">
      <div class="expense-emoji" style="background:${(CATEGORIES[r.category] || CATEGORIES.otro).color}22">${(CATEGORIES[r.category] || CATEGORIES.otro).emoji}</div>
      <div class="expense-info">
        <div class="expense-desc">${escapeHTML(r.description)}</div>
        <div class="muted">día ${r.day_of_month} de cada mes</div>
      </div>
      <div class="expense-amount">${fmt(r.amount)}</div>
      <button class="btn-link delete-recurring-btn" data-id="${r.id}">🗑️</button>
    </div>`).join('') : '<p class="muted">No hay gastos recurrentes.</p>';
  el.querySelectorAll('.delete-recurring-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      await api(`/api/recurring/${btn.dataset.id}`, { method: 'DELETE' });
      loadRecurring();
    });
  });
}

document.getElementById('add-recurring-btn').addEventListener('click', () => {
  const root = document.getElementById('modal-root');
  const catOptions = Object.keys(CATEGORIES).map(c => `<option value="${c}">${CATEGORIES[c].emoji} ${c}</option>`).join('');
  root.innerHTML = `
    <div class="modal-overlay" id="rec-overlay">
      <div class="modal">
        <h3>Nuevo recurrente</h3>
        <input type="text" id="rec-desc" placeholder="Descripción">
        <input type="number" id="rec-amount" placeholder="Monto">
        <select id="rec-cat">${catOptions}</select>
        <input type="number" id="rec-day" placeholder="Día del mes (1-28)" min="1" max="28">
        <button class="btn-primary" id="rec-save">Guardar</button>
        <button class="btn-secondary" id="rec-cancel">Cancelar</button>
      </div>
    </div>`;
  const close = () => { root.innerHTML = ''; };
  document.getElementById('rec-overlay').addEventListener('click', (e) => { if (e.target.id === 'rec-overlay') close(); });
  document.getElementById('rec-cancel').addEventListener('click', close);
  document.getElementById('rec-save').addEventListener('click', async () => {
    try {
      await api('/api/recurring', {
        method: 'POST',
        body: JSON.stringify({
          description: document.getElementById('rec-desc').value,
          amount: Number(document.getElementById('rec-amount').value),
          category: document.getElementById('rec-cat').value,
          day_of_month: Number(document.getElementById('rec-day').value),
        }),
      });
      close();
      loadRecurring();
    } catch (err) { showToast(err.message); }
  });
});

checkSession();
</script>
</body>
